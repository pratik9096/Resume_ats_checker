# ===== Server =====
server.port=8080

# ===== Database (MySQL) =====
# For local dev, create a database first: CREATE DATABASE resume_ats_checker;
spring.datasource.url=jdbc:mysql://localhost:3306/resume_ats_checker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== File upload limits =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Groq API =====
# Get a free API key at https://console.groq.com
# NEVER commit your real key to GitHub - use an environment variable instead:
# export GROQ_API_KEY=${API KEY GROQ}
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${openai/gpt-oss-20b}
